<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Icon Debug</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css" />
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .icon-item { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    .ti { font-size: 24px; }
  </style>
</head>
<body>
  <h1>Icon Test</h1>
  <div class="icon-grid">
    <div class="icon-item">
      <i class="ti ti-charging"></i>
      <span>ti-charging</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-ev-plug"></i>
      <span>ti-ev-plug</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-ev-plug-charging"></i>
      <span>ti-ev-plug-charging</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-ev-plug-ac"></i>
      <span>ti-ev-plug-ac</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-ev-plug-dc"></i>
      <span>ti-ev-plug-dc</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-ev-station"></i>
      <span>ti-ev-station</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-power-plug"></i>
      <span>ti-power-plug</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-plug-connected"></i>
      <span>ti-plug-connected</span>
    </div>
  </div>
</body>
</html>
