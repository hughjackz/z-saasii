<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Icon Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css" />
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .icon-item { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    .ti { font-size: 24px; color: #333; }
    /* Test scoped styles */
    .test-scoped .ti { font-size: 24px; color: #333; }
  </style>
</head>
<body>
  <h1>Icon Test</h1>

  <h2>Without scoped class</h2>
  <div class="icon-grid">
    <div class="icon-item">
      <i class="ti ti-charging"></i>
      <span>ti-charging</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-ev-plug"></i>
      <span>ti-ev-plug</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-power-plug"></i>
      <span>ti-power-plug</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-plug-connected"></i>
      <span>ti-plug-connected</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-device-charging"></i>
      <span>ti-device-charging</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-device-watch"></i>
      <span>ti-device-watch</span>
    </div>
  </div>

  <h2>With scoped class simulation</h2>
  <div class="icon-grid test-scoped">
    <div class="icon-item">
      <i class="ti ti-charging"></i>
      <span>ti-charging</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-ev-plug"></i>
      <span>ti-ev-plug</span>
    </div>
    <div class="icon-item">
      <i class="ti ti-power-plug"></i>
      <span>ti-power-plug</span>
    </div>
  </div>

  <h2>DeviceSelector example</h2>
  <div class="device-selector" style="display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 0.5px solid #ddd; border-radius: 8px; padding: 5px 10px;">
    <i class="ti ti-charging"></i>
    <select style="appearance: none; -webkit-appearance: none; border: none; background: transparent;">
      <option>Test Device</option>
    </select>
  </div>
</body>
</html>
